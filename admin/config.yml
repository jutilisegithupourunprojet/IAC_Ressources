backend:
  name: github
  repo: jutilisegithupourunprojet/IAC_Ressources
  branch: main
  # Adresse du site en ligne (à corriger si le nom de domaine change).
  base_url: https://www.isabellecourias.fr
  auth_endpoint: api/auth

# Les images ajoutées depuis l'éditeur sont rangées ici.
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

locale: "fr"

collections:
  - name: pages
    label: "Textes des pages"
    files:
      - name: accueil
        label: "Page d'accueil"
        file: content/pages/accueil.json
        fields:
          - { label: "Phrase d'accroche (au-dessus du titre)", name: kicker, widget: string }
          - { label: "Paragraphe d'introduction", name: intro, widget: text }
          - { label: "Ligne des métiers (sous l'introduction)", name: metiers, widget: string }
          - { label: "Titre de la section « Ateliers & Formations »", name: teaser_titre, widget: string }
          - { label: "Texte de la section « Ateliers & Formations »", name: teaser_texte, widget: text }

      - name: apropos
        label: "À propos"
        file: content/pages/apropos.json
        fields:
          - { label: "Phrase d'accroche", name: kicker, widget: string }
          - { label: "Paragraphe d'introduction", name: intro, widget: text }
          - { label: "Citation", name: citation, widget: string }

      - name: outils
        label: "Mes outils"
        file: content/pages/outils.json
        fields:
          - { label: "Phrase d'accroche", name: kicker, widget: string }
          - { label: "Paragraphe d'introduction", name: intro, widget: text }
          - label: "Outil 1 — Psycho-praticienne"
            name: outil1
            widget: object
            collapsed: true
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: "4 points clés", name: points, widget: list, min: 4, max: 4 }
          - label: "Outil 2 — Formation PNL"
            name: outil2
            widget: object
            collapsed: true
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: "4 points clés", name: points, widget: list, min: 4, max: 4 }
          - label: "Outil 3 — Coaching d'entreprise"
            name: outil3
            widget: object
            collapsed: true
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: "4 points clés", name: points, widget: list, min: 4, max: 4 }
          - label: "Outil 4 — Hypnose Éricksonienne"
            name: outil4
            widget: object
            collapsed: true
            fields:
              - { label: Titre, name: titre, widget: string }
              - { label: Texte, name: texte, widget: text }
              - { label: "4 points clés", name: points, widget: list, min: 4, max: 4 }
          - { label: "Titre du bandeau final", name: cta_titre, widget: string }
          - { label: "Texte du bandeau final", name: cta_texte, widget: text }

      - name: podcasts
        label: Podcasts
        file: content/pages/podcasts.json
        fields:
          - { label: "Phrase d'accroche", name: kicker, widget: string }
          - { label: "Paragraphe d'introduction", name: intro, widget: text }
          - { label: "Épisode 1 — titre", name: ep1_titre, widget: string }
          - { label: "Épisode 1 — identifiant vidéo YouTube", name: ep1_id, widget: string, hint: "Les 11 caractères après watch?v= dans l'adresse YouTube." }
          - { label: "Épisode 1 — description", name: ep1_description, widget: text }
          - { label: "Épisode 2 — titre", name: ep2_titre, widget: string }
          - { label: "Épisode 2 — identifiant vidéo YouTube", name: ep2_id, widget: string }
          - { label: "Épisode 2 — description", name: ep2_description, widget: text }

      - name: agenda_liens
        label: "Agenda et formulaires"
        file: content/pages/liens.json
        fields:
          - { label: "Adresse e-mail de l'agenda Google", name: agenda_email, widget: string, hint: "Google Agenda > Paramètres > Intégrer l'agenda, la partie src= de l'adresse." }
          - { label: "Identifiant du formulaire de réservation", name: formspree_reservation, widget: string, hint: "La partie après formspree.io/f/" }
          - { label: "Identifiant du formulaire du blog", name: formspree_blog, widget: string }

  - name: formations
    label: "Ateliers & Formations"
    folder: content/formations
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Titre", name: titre, widget: string }
      - { label: "Sous-titre", name: sous_titre, widget: string }
      - { label: "Badge (ex. Formation · 2 jours · 12 heures, ou Atelier · demi-journée)", name: badge, widget: string }
      - { label: "Photo de couverture", name: image, widget: image, required: false }
      - { label: "Prochaines dates", name: dates, widget: string, required: false }
      - { label: Lieu, name: lieu, widget: string, required: false }
      - { label: Tarif, name: tarif, widget: string, required: false }
      - { label: Public, name: public_vise, widget: string, required: false }
      - { label: Prérequis, name: prerequis, widget: string, required: false }
      - { label: "Présentation complète", name: body, widget: markdown, hint: "# pour un grand titre centré (une grande partie : introduction, programme, méthodes…), ## pour une sous-partie (ex. Jour 1), ### pour un petit intitulé (ex. Matin), > pour encadrer un objectif important." }

  - name: blog
    label: "Articles du blog"
    folder: content/blog
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: Titre, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD" }
      - { label: "Résumé (affiché dans la liste)", name: excerpt, widget: text }
      - { label: Image, name: image, widget: image, required: false }
      - { label: "Contenu de l'article", name: body, widget: markdown, hint: "# pour un grand titre centré, ## pour une sous-partie, ### pour un petit intitulé, > pour encadrer un passage important." }
